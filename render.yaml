services:
  - type: web
    name: telegram-bot
    env: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: hypercorn bot:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: 8443
      - key: EXCEL_FILE_PATH
        value: rep.xlsx
      - key: MAX_REQUESTS_PER_MINUTE
        value: 30
      - key: CACHE_TTL
        value: 300
