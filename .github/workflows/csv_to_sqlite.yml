name: Convert rep.csv to rep.db

on:
  push:
    paths:
      - 'rep.csv'
  workflow_dispatch:

jobs:
  csv-to-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create csv_to_sqlite.py
        run: |
          cat <<EOF > csv_to_sqlite.py
          import csv, sqlite3, os
          csv_file = 'rep.csv'
          db_file = 'rep.db'
          if not os.path.exists(csv_file):
              raise SystemExit(f'Không tìm thấy file {csv_file}')
          with open(csv_file, newline='', encoding='utf-8') as f:
              reader = csv.reader(f)
              headers = next(reader)
              rows = list(reader)
          conn = sqlite3.connect(db_file)
          cur = conn.cursor()
          cur.execute(f'DROP TABLE IF EXISTS rep')
          col_defs = ', '.join(f'"{h}" TEXT' for h in headers)
          cur.execute(f'CREATE TABLE rep ({col_defs})')
          placeholders = ', '.join('?' for _ in headers)
          cur.executemany(f'INSERT INTO rep VALUES ({placeholders})', rows)
          conn.commit()
          conn.close()
          print(f'Đã nạp dữ liệu từ {csv_file} vào {db_file}:rep')
          EOF

      - name: Run CSV to SQLite conversion
        run: python csv_to_sqlite.py

      - name: Commit and push rep.db
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add rep.db
          git commit -m "Auto update rep.db from rep.csv" || echo "No changes to commit"
          git push
